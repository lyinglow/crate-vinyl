<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crate</title>
<meta name="description" content="Your vinyl collection, linked to Discogs.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Crate">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* The opening screen. Inline, so it shows before anything else has loaded. */
#boot { position: fixed; inset: 0; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; background: #fff; color: #1d1d1f; transition: opacity 0.35s ease; }
#boot.gone { opacity: 0; pointer-events: none; }
#boot .disc { width: 84px; height: 84px; border-radius: 50%; background: radial-gradient(circle, #d9d9de 0 9%, #c24a3a 9% 27%, #1b1b1d 27% 29%, #2a2a2d 29% 40%, #1b1b1d 40% 42%, #2a2a2d 42% 54%, #1b1b1d 54% 56%, #2a2a2d 56% 69%, #151517 69%); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.22); animation: bootspin 1.6s linear infinite; }
#boot .name { font: 600 15px/1 -apple-system, system-ui, sans-serif; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.5; }
#boot .slow { font: 14px/1.4 -apple-system, system-ui, sans-serif; opacity: 0; max-width: 260px; text-align: center; transition: opacity 0.4s; }
#boot .slow.show { opacity: 0.6; }
@keyframes bootspin { to { transform: rotate(360deg); } }
@media (prefers-color-scheme: dark) { #boot { background: #000; color: #f5f5f7; } #boot .disc { box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.08); } }
@media (prefers-reduced-motion: reduce) { #boot .disc { animation: bootpulse 2s ease-in-out infinite; } @keyframes bootpulse { 50% { opacity: 0.45; } } }
</style>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="boot" role="status" aria-live="polite" aria-label="Crate is opening"><div class="disc"></div><div class="name">Crate</div><div class="slow" id="boot-slow">Still opening. If this stays, close Crate and open it again.</div></div>
<script>setTimeout(function () { var s = document.getElementById('boot-slow'); if (s && document.getElementById('boot')) s.className += ' show'; }, 9000);</script>
<button id="syncbar" hidden aria-live="polite"></button>
<main id="view"></main>
<nav id="tabs" aria-label="Main"></nav>
<div id="layer"></div>
<noscript><p style="padding:24px;font:16px system-ui">Crate needs JavaScript to run.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
